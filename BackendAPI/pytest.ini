[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# The suite is `tests/`. Without this, pytest also collects `test_db.py` and
# `scripts/test_decryption.py` — manual connectivity probes that happen to match
# the default `test_*.py` pattern. They are bare `async def`s with no asyncio
# marker, so they always fail, and a permanently red run trains people to ignore
# the result.
testpaths = tests
